<body data-page="calendar" data-kind="owner">
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="shell"><header class="header"><button class="icon-btn hamburger" data-action="menu" aria-label="Меню"><svg class="icon  " aria-hidden="true"><use href="icons.svg#menu"></use></svg></button><a class="logo" href="index.html" aria-label="PAZLIX — главная">PAZLIX<span class="brand-mark"></span></a><button class="icon-btn bell" data-action="notifications" aria-label="Уведомления"><svg class="icon  " aria-hidden="true"><use href="icons.svg#bell"></use></svg><i></i></button></header><main id="main" class="page calendar-page"><div class="page-heading"><div><h1>Календарь</h1><p class="subtitle">Расписание студии</p></div><button type="button" class="btn soft" data-action="today" >Сегодня</button></div><div class="calendar-layout"><section class="card full-calendar-card"><div class="calendar-titlebar"><button type="button" class="btn icon-btn" data-action="prev-month" id="prevMonth" aria-label="Предыдущий месяц"><svg class="icon  " aria-hidden="true"><use href="icons.svg#left"></use></svg></button><div class="month-center"><h2 id="monthTitle">Сентябрь 2026</h2><small id="monthSummary"></small></div><button type="button" class="btn icon-btn" data-action="next-month" id="nextMonth" aria-label="Следующий месяц"><svg class="icon  " aria-hidden="true"><use href="icons.svg#right"></use></svg></button></div><div class="month-weekdays" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div id="monthCalendar" class="month-calendar" role="group" aria-label="Дни месяца"></div><div class="calendar-legend"><span><i class="legend-dot booked"></i>Есть записи</span><span><i class="legend-dot free"></i>Свободно</span><span><i class="legend-dot closed"></i>Закрыто</span></div></section><div class="day-panel"><section class="selected-day-head"><span class="eyebrow">Выбранный день</span><h2 id="selectedDateTitle"></h2><p id="selectedDaySummary"></p><div class="day-head-actions"></div></section><div class="timeline" id="dayTimeline" aria-live="polite"></div></div></div></main><nav class="bottom" aria-label="Основная навигация"><a href="ai.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#spark"></use></svg><span>AI</span></a><a href="calendar.html" class="active" aria-current="page"><svg class="icon  " aria-hidden="true"><use href="icons.svg#calendar"></use></svg><span>Календарь</span></a><a href="requests.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#inbox"></use></svg><span>Заявки</span></a><a href="history.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#history"></use></svg><span>История</span></a><a href="profile.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#user"></use></svg><span>Профиль</span></a></nav></div>
