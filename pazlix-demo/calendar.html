<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PAZLIX — Календарь</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="shell">
<header class="header"><button class="hamburger" aria-label="Меню">☰</button><div class="logo">PAZLIX</div><button class="bell" aria-label="Уведомления">♧</button></header>
<main class="page calendar-page">
<section class="calendar-hero"><div><h1 class="page-title">Календарь</h1><p class="subtitle">Все записи и свободное время — сразу перед глазами.</p></div><button class="btn soft todayBtn">Сегодня</button></section>
<section class="card full-calendar-card"><div class="calendar-titlebar"><button class="arrow" id="prevMonth" aria-label="Предыдущий месяц">‹</button><div class="month-center"><div class="month-title" id="monthTitle">Сентябрь 2026</div><small id="monthSummary">12 записей · 7 свободных дней</small></div><button class="arrow" id="nextMonth" aria-label="Следующий месяц">›</button></div><div class="month-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="month-calendar" id="monthCalendar"></div><div class="calendar-legend"><span><i class="legend-dot booked"></i>Есть записи</span><span><i class="legend-dot free"></i>Свободно</span><span><i class="legend-dot closed"></i>Закрыто</span></div></section>
<section class="selected-day-head"><div><small class="eyebrow">Выбранный день</small><h2 id="selectedDateTitle">Четверг, 24 сентября</h2><p id="selectedDaySummary">3 записи · первое свободное время 12:00</p></div><div class="day-head-actions"><button class="btn" data-sheet="block">◷ Закрыть время</button><button class="btn rose" data-sheet="booking">＋ Добавить запись</button></div></section>
<section class="timeline" id="dayTimeline"></section>
</main>
