<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PAZLIX — Календарь</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="shell">
<header class="header"><button class="hamburger" aria-label="Меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><a class="logo" href="index.html" aria-label="На главную">PAZLIX<span class="brand-mark"></span></a><button class="bell" aria-label="Уведомления"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18H5.8a1 1 0 0 1-.8-1.6L6 15V10a6 6 0 1 1 12 0v5l1 1.4a1 1 0 0 1-.8 1.6H15"/><path d="M10 18a2 2 0 0 0 4 0"/></svg></button></header>
<main class="page calendar-page">
<section class="calendar-hero"><div><h1 class="page-title">Календарь</h1><p class="subtitle">Полный месяц, свободные дни и все записи.</p></div><button class="btn soft todayBtn">Сегодня</button></section>
<section class="card full-calendar-card"><div class="calendar-titlebar"><button class="arrow" id="prevMonth" aria-label="Предыдущий месяц">‹</button><div class="month-center"><div class="month-title" id="monthTitle">Сентябрь 2026</div><small id="monthSummary">12 записей · нажмите на день</small></div><button class="arrow" id="nextMonth" aria-label="Следующий месяц">›</button></div><div class="month-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="month-calendar" id="monthCalendar"></div><div class="calendar-legend"><span><i class="legend-dot free"></i>Свободно</span><span><i class="legend-dot booked"></i>Есть записи</span><span><i class="legend-dot closed"></i>Закрыто</span></div></section>
<section class="selected-day-head"><small class="eyebrow">Выбранный день</small><h2 id="selectedDateTitle">Четверг, 24 сентября</h2><p id="selectedDaySummary">3 записи</p><div class="day-head-actions"><button class="btn" data-sheet="block">Закрыть время</button><button class="btn primary" data-sheet="booking">+ Запись</button></div></section>
<section class="timeline" id="dayTimeline"></section>
</main>

<div class="sheet-backdrop" id="sheetBackdrop"></div><section class="bottom-sheet" id="actionSheet" aria-hidden="true"><div class="sheet-handle"></div><div id="sheetContent"></div></section><div class="toast" id="toast"></div><script src="app.js"></script></div></body></html>
