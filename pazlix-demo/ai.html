<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="PAZLIX — онлайн-запись и рабочий кабинет студии.">
  <title>PAZLIX — AI-помощник</title>
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="prototype-store.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="ai" data-kind="owner">
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="shell"><header class="header"><button class="icon-btn hamburger" data-action="menu" aria-label="Меню"><svg class="icon  " aria-hidden="true"><use href="icons.svg#menu"></use></svg></button><a class="logo" href="index.html" aria-label="PAZLIX — главная">PAZLIX<span class="brand-mark"></span></a><button class="icon-btn bell" data-action="notifications" aria-label="Уведомления"><svg class="icon  " aria-hidden="true"><use href="icons.svg#bell"></use></svg><i></i></button></header><main id="main" class="page chat-page"><div class="page-heading"><div><h1>AI-помощник</h1><p class="subtitle">Помощь в ежедневных делах</p></div></div><div class="chat-surface"><div class="assistant-heading"><span class="icon-wrap icon-purple"><svg class="icon  " aria-hidden="true"><use href="icons.svg#spark"></use></svg></span><div><strong>Помощник PAZLIX</strong><small>Демонстрация диалога</small></div></div><div id="chatLog" class="chat-log" role="log" aria-live="polite"><div class="bubble"><p>Что хотите сделать в студии? Помогу настроить услуги, расписание или вашу страницу.</p></div></div><div class="ai-quick"><button type="button" class="btn " data-action="ai-quick" data-prompt="Добавить услугу">Добавить услугу</button><button type="button" class="btn " data-action="ai-quick" data-prompt="Изменить расписание">Изменить расписание</button><button type="button" class="btn " data-action="ai-quick" data-prompt="Добавить работы">Добавить работы</button><button type="button" class="btn " data-action="ai-quick" data-prompt="Подключить Telegram">Подключить Telegram</button></div><form class="composer" data-form="chat"><label class="sr-only" for="aiText">Ваше сообщение</label><textarea id="aiText" rows="1" placeholder="Напишите сообщение…" required></textarea><button type="submit" class="icon-btn primary" id="aiSend" aria-label="Отправить сообщение"><svg class="icon  " aria-hidden="true"><use href="icons.svg#send"></use></svg></button></form><p class="field-help">Помощник предложит следующий шаг. Изменения подтверждаете вы.</p></div></main><nav class="bottom" aria-label="Основная навигация"><a href="ai.html" class="active" aria-current="page"><svg class="icon  " aria-hidden="true"><use href="icons.svg#spark"></use></svg><span>AI</span></a><a href="calendar.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#calendar"></use></svg><span>Календарь</span></a><a href="requests.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#inbox"></use></svg><span>Заявки</span></a><a href="history.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#history"></use></svg><span>История</span></a><a href="profile.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#user"></use></svg><span>Профиль</span></a></nav></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="actionSheet" class="bottom-sheet" aria-labelledby="sheetTitle"><div class="sheet-top"><span class="sheet-handle"></span><button type="button" class="icon-btn" data-action="close-sheet" aria-label="Закрыть окно"><svg class="icon  " aria-hidden="true"><use href="icons.svg#close"></use></svg></button></div><div id="sheetContent"></div></dialog>
</body>
</html>
