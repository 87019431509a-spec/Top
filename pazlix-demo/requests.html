<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="PAZLIX — онлайн-запись и рабочий кабинет студии.">
  <title>PAZLIX — Заявки</title>
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">

<body data-page="requests" data-kind="owner">
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="shell"><header class="header"><button class="icon-btn hamburger" data-action="menu" aria-label="Меню"><svg class="icon  " aria-hidden="true"><use href="icons.svg#menu"></use></svg></button><a class="logo" href="index.html" aria-label="PAZLIX — главная">PAZLIX<span class="brand-mark"></span></a><button class="icon-btn bell" data-action="notifications" aria-label="Уведомления"><svg class="icon  " aria-hidden="true"><use href="icons.svg#bell"></use></svg><i></i></button></header><main id="main" class="page "><div class="page-heading"><div><h1>Заявки</h1><p class="subtitle">Новые записи и ваши решения</p></div></div><div class="tabs" role="group" aria-label="Статус заявки"><button type="button" class="btn " data-action="request-tab" data-value="pending" aria-pressed="true">Новые</button><button type="button" class="btn " data-action="request-tab" data-value="confirmed" aria-pressed="false">Подтверждены</button><button type="button" class="btn " data-action="request-tab" data-value="archived" aria-pressed="false">Архив</button></div><div class="searchrow"><label class="search"><svg class="icon  " aria-hidden="true"><use href="icons.svg#search"></use></svg><input id="requestSearch" type="search" aria-label="Найти заявку" placeholder="Имя или телефон"></label><button type="button" class="btn icon-btn" data-action="filters" aria-label="Фильтры заявок"><svg class="icon  " aria-hidden="true"><use href="icons.svg#filter"></use></svg></button></div><p id="requestCount" class="result-count" aria-live="polite"></p><div id="requestList" class="record-grid"></div></main><nav class="bottom" aria-label="Основная навигация"><a href="ai.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#spark"></use></svg><span>AI</span></a><a href="calendar.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#calendar"></use></svg><span>Календарь</span></a><a href="requests.html" class="active" aria-current="page"><svg class="icon  " aria-hidden="true"><use href="icons.svg#inbox"></use></svg><span>Заявки</span></a><a href="history.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#history"></use></svg><span>История</span></a><a href="profile.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#user"></use></svg><span>Профиль</span></a></nav></div>

  <dialog id="actionSheet" class="bottom-sheet" aria-labelledby="sheetTitle"><div class="sheet-top"><span class="sheet-handle"></span><button type="button" class="icon-btn" data-action="close-sheet" aria-label="Закрыть окно"><svg class="icon  " aria-hidden="true"><use href="icons.svg#close"></use></svg></button></div><div id="sheetContent"></div></dialog>
