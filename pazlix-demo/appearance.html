<body data-page="appearance" data-kind="owner">
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="shell"><header class="header"><a class="icon-btn" href="profile.html" aria-label="Назад в профиль"><svg class="icon  " aria-hidden="true"><use href="icons.svg#left"></use></svg></a><a class="logo" href="index.html" aria-label="PAZLIX — главная">PAZLIX<span class="brand-mark"></span></a><button class="icon-btn bell" data-action="notifications" aria-label="Уведомления"><svg class="icon  " aria-hidden="true"><use href="icons.svg#bell"></use></svg><i></i></button></header><main id="main" class="page narrow-page"><div class="page-heading"><div><h1>Оформление</h1><p class="subtitle">Единый стиль вашей публичной страницы</p></div></div><form data-form="settings" data-scope="appearance"><section class="card "><h2>Стиль страницы</h2><p>Оформление меняет только клиентскую страницу.</p><div class="choice-grid"><label class="choice"><input type="radio" name="theme" value="light" checked><span class="theme-sample theme-light"><i></i><i></i><i></i></span><strong>Светлый</strong><small>Чёткая структура</small></label><label class="choice"><input type="radio" name="theme" value="minimal"><span class="theme-sample theme-minimal"><i></i><i></i><i></i></span><strong>Минимальный</strong><small>Меньше разделителей</small></label><label class="choice"><input type="radio" name="theme" value="dark"><span class="theme-sample theme-dark"><i></i><i></i><i></i></span><strong>Тёмный</strong><small>Мягкий контраст</small></label><label class="choice"><input type="radio" name="theme" value="compact"><span class="theme-sample theme-compact"><i></i><i></i><i></i></span><strong>Каталог</strong><small>Больше услуг в ряду</small></label></div></section><section class="card "><h2>Шрифт и акцент</h2><div class="form-grid"><label class="field"><span>Шрифт</span><select name="font"><option value="system" selected>Inter</option><option value="humanist">Гуманистический</option></select></label><label class="field"><span>Акцент</span><select name="accent"><option value="indigo" selected>Индиго</option><option value="blue">Синий</option><option value="green">Зелёный</option><option value="purple">Фиолетовый</option></select></label></div><div id="appearancePreview" class="appearance-preview"><span class="eyebrow">Предпросмотр</span><h3>Lash Studio Анны</h3><p>Классическое наращивание · 1 ч 30 мин</p><span class="preview-button">Записаться</span></div></section><div class="form-footer"><p class="save-status" role="status"></p><button class="btn primary" type="submit"><svg class="icon  " aria-hidden="true"><use href="icons.svg#check"></use></svg>Сохранить изменения</button></div></form><a class="btn soft" href="public-preview.html">Открыть публичную страницу</a></main><nav class="bottom" aria-label="Основная навигация"><a href="ai.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#spark"></use></svg><span>AI</span></a><a href="calendar.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#calendar"></use></svg><span>Календарь</span></a><a href="requests.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#inbox"></use></svg><span>Заявки</span></a><a href="history.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#history"></use></svg><span>История</span></a><a href="profile.html" class="active" aria-current="page"><svg class="icon  " aria-hidden="true"><use href="icons.svg#user"></use></svg><span>Профиль</span></a></nav></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="actionSheet" class="bottom-sheet" aria-labelledby="sheetTitle"><div class="sheet-top"><span class="sheet-handle"></span><button type="button" class="icon-btn" data-action="close-sheet" aria-label="Закрыть окно"><svg class="icon  " aria-hidden="true"><use href="icons.svg#close"></use></svg></button></div><div id="sheetContent"></div></dialog>
</body>
