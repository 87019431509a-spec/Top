<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="PAZLIX — онлайн-запись и рабочий кабинет студии.">
  <title>PAZLIX — Консультант студии</title>
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="prototype-store.js" defer></script>

<body data-page="client-consultant" data-kind="public">
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="shell"><header class="public-header"><a class="icon-btn" href="public-preview.html" aria-label="Назад"><svg class="icon  " aria-hidden="true"><use href="icons.svg#left"></use></svg></a><a href="public-preview.html" class="studio-brand">LASH STUDIO</a><a class="btn text-btn" href="client-bookings.html">Мои записи</a></header><main id="main" class="page public-page "><div class="page-heading"><div><h1>Чем помочь?</h1></div></div><div class="chat-surface"><div class="assistant-heading"><span class="icon-wrap icon-purple"><svg class="icon  " aria-hidden="true"><use href="icons.svg#spark"></use></svg></span><div><strong>Консультант студии</strong><small>Демонстрация диалога</small></div></div><div id="chatLog" class="chat-log" role="log" aria-live="polite"><div class="bubble"><p>Помогу выбрать услугу и расскажу, как подготовиться к визиту.</p></div></div><div class="ai-quick"><button type="button" class="btn " data-action="ai-quick" data-prompt="Классика или 2D?">Классика или 2D?</button><button type="button" class="btn " data-action="ai-quick" data-prompt="Как подготовиться?">Как подготовиться?</button><button type="button" class="btn " data-action="ai-quick" data-prompt="Сколько стоит?">Сколько стоит?</button><button type="button" class="btn " data-action="ai-quick" data-prompt="Как вас найти?">Как вас найти?</button></div><form class="composer" data-form="chat"><label class="sr-only" for="aiText">Ваше сообщение</label><textarea id="aiText" rows="1" placeholder="Напишите сообщение…" required></textarea><button type="submit" class="icon-btn primary" id="aiSend" aria-label="Отправить сообщение"><svg class="icon  " aria-hidden="true"><use href="icons.svg#send"></use></svg></button></form><p class="field-help">По вопросам самочувствия и противопоказаний обратитесь к мастеру.</p></div><a class="btn primary full" href="client-booking.html">Перейти к записи</a></main></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="actionSheet" class="bottom-sheet" aria-labelledby="sheetTitle"><div class="sheet-top"><span class="sheet-handle"></span><button type="button" class="icon-btn" data-action="close-sheet" aria-label="Закрыть окно"><svg class="icon  " aria-hidden="true"><use href="icons.svg#close"></use></svg></button></div><div id="sheetContent"></div></dialog>
</body>
