<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="PAZLIX — онлайн-запись и рабочий кабинет студии.">
  <title>PAZLIX — Новый пароль</title>
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="prototype-store.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="reset-password" data-kind="auth">
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="shell"><main id="main" class="auth-shell"><div class="auth-brand"><a class="logo" href="login.html">PAZLIX<span class="brand-mark"></span></a><span class="eyebrow">Рабочий кабинет</span></div><section class="auth-card"><div class="page-heading"><div><h1>Новый пароль</h1><p class="subtitle">Используйте не менее 8 символов.</p></div></div><form data-form="reset"><label class="field"><span>Новый пароль</span><input name="password" type="password" value="" required minlength="8" autocomplete="new-password"></label><label class="field"><span>Повторите пароль</span><input name="repeat" type="password" value="" required minlength="8" autocomplete="new-password"></label><div class="form-error" role="alert"></div><button class="btn primary full" type="submit">Сохранить пароль</button></form><div id="resetResult" hidden class="success-panel" role="status"><h2>Всё готово</h2><p>Сценарий восстановления завершён. Пароль в прототипе не сохраняется.</p><a class="btn primary full" href="login.html">Перейти ко входу</a></div></section><p class="demo-note">UI-прототип · изменения сохраняются на этом устройстве</p></main></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="actionSheet" class="bottom-sheet" aria-labelledby="sheetTitle"><div class="sheet-top"><span class="sheet-handle"></span><button type="button" class="icon-btn" data-action="close-sheet" aria-label="Закрыть окно"><svg class="icon  " aria-hidden="true"><use href="icons.svg#close"></use></svg></button></div><div id="sheetContent"></div></dialog>
</body>
</html>
