<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="PAZLIX — онлайн-запись и рабочий кабинет студии.">
  <title>PAZLIX — Контакты</title>
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">

  <script src="app.js" defer></script>

<body data-page="contacts" data-kind="owner">
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="shell"><header class="header"><a class="icon-btn" href="profile.html" aria-label="Назад в профиль"><svg class="icon  " aria-hidden="true"><use href="icons.svg#left"></use></svg></a><a class="logo" href="index.html" aria-label="PAZLIX — главная">PAZLIX<span class="brand-mark"></span></a><button class="icon-btn bell" data-action="notifications" aria-label="Уведомления"><svg class="icon  " aria-hidden="true"><use href="icons.svg#bell"></use></svg><i></i></button></header><main id="main" class="page narrow-page"><div class="page-heading"><div><h1>Контакты</h1><p class="subtitle">Эти данные увидят ваши клиенты</p></div></div><form data-form="settings" data-scope="contacts"><section class="card "><h2>Связь и адрес</h2><div class="form-grid"><label class="field"><span>Телефон</span><input name="phone" type="tel" value="+7 900 123-45-67" required autocomplete="tel"></label><label class="field"><span>Telegram</span><input name="telegram" type="text" value="@lash_anna" ></label><label class="field"><span>Город</span><input name="city" type="text" value="Новосибирск" required></label><label class="field"><span>Адрес студии</span><input name="address" type="text" value="Красный проспект, 25" required></label></div><label class="field"><span>Как добраться</span><textarea name="directions" >Вход со стороны проспекта, второй этаж.</textarea></label></section><section class="card "><h2>Ссылки на карты</h2><p>Добавьте прямую ссылку на вашу студию.</p><label class="field"><span>2ГИС</span><input name="map2gis" type="url" value="" placeholder="https://2gis.ru/…"></label><label class="field"><span>Яндекс Карты</span><input name="mapYandex" type="url" value="" placeholder="https://yandex.ru/maps/…"></label><label class="field"><span>Google Maps</span><input name="mapGoogle" type="url" value="" placeholder="https://maps.google.com/…"></label></section><div class="form-footer"><p class="save-status" role="status"></p><button class="btn primary" type="submit"><svg class="icon  " aria-hidden="true"><use href="icons.svg#check"></use></svg>Сохранить изменения</button></div></form></main><nav class="bottom" aria-label="Основная навигация"><a href="ai.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#spark"></use></svg><span>AI</span></a><a href="calendar.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#calendar"></use></svg><span>Календарь</span></a><a href="requests.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#inbox"></use></svg><span>Заявки</span></a><a href="history.html"><svg class="icon  " aria-hidden="true"><use href="icons.svg#history"></use></svg><span>История</span></a><a href="profile.html" class="active" aria-current="page"><svg class="icon  " aria-hidden="true"><use href="icons.svg#user"></use></svg><span>Профиль</span></a></nav></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="actionSheet" class="bottom-sheet" aria-labelledby="sheetTitle"><div class="sheet-top"><span class="sheet-handle"></span><button type="button" class="icon-btn" data-action="close-sheet" aria-label="Закрыть окно"><svg class="icon  " aria-hidden="true"><use href="icons.svg#close"></use></svg></button></div><div id="sheetContent"></div></dialog>
</body>
</html>
