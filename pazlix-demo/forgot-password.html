<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="PAZLIX — онлайн-запись и рабочий кабинет студии.">
  <title>PAZLIX — Восстановление доступа</title>
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="prototype-store.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="forgot-password" data-kind="auth">
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="shell"><main id="main" class="auth-shell"><div class="auth-brand"><a class="logo" href="login.html">PAZLIX<span class="brand-mark"></span></a><span class="eyebrow">Рабочий кабинет</span></div><section class="auth-card"><span class="icon-wrap icon-primary"><svg class="icon  " aria-hidden="true"><use href="icons.svg#lock"></use></svg></span><div class="page-heading"><div><h1>Забыли пароль?</h1><p class="subtitle">Укажите email вашего кабинета.</p></div></div><form data-form="forgot"><label class="field"><span>Email</span><input name="email" type="email" value="" required autocomplete="email" placeholder="anna@example.com"></label><button class="btn primary full" type="submit">Восстановить доступ</button></form><div id="recoveryResult" hidden class="success-panel" role="status"><h2>Ссылка подготовлена</h2><p>В рабочем сервисе она придёт на почту. Сейчас можно проверить следующий шаг.</p><a class="btn primary full" href="reset-password.html">Задать новый пароль</a></div><a class="btn text-btn full" href="login.html">Вернуться ко входу</a></section><p class="demo-note">UI-прототип · изменения сохраняются на этом устройстве</p></main></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="actionSheet" class="bottom-sheet" aria-labelledby="sheetTitle"><div class="sheet-top"><span class="sheet-handle"></span><button type="button" class="icon-btn" data-action="close-sheet" aria-label="Закрыть окно"><svg class="icon  " aria-hidden="true"><use href="icons.svg#close"></use></svg></button></div><div id="sheetContent"></div></dialog>
</body>
</html>
